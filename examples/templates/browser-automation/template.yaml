name: browser-automation
version: "1.0.0"
description: "浏览器自动化沙箱环境 - 预装 Playwright + Chromium，支持网页抓取与 UI 测试"
author: "Serverless-Sandbox"
tags:
  - browser
  - playwright
  - chromium
  - automation
  - web-scraping

base: mcr.microsoft.com/playwright/python:v1.40.0-jammy

system_packages:
  - python3
  - python3-pip
  - python3-venv
  - nodejs
  - npm
  - curl
  - wget
  - xvfb
  - jq

python_packages:
  - playwright>=1.40.0
  - beautifulsoup4
  - lxml
  - httpx
  - Pillow

commands:
  - python3 -m playwright install chromium
  - python3 -m playwright install-deps chromium

capabilities:
  - shell
  - files
  - code
  - ports

ports:
  - 9000

custom_commands:
  run:
    cmd: "python3 {script}"
    description: "Run a browser automation script"
    cwd: "/app"
    timeout: 120
    args:
      - name: script
        default: "main.py"
        description: "Python script to execute"

env:
  DISPLAY: ":99"
  PLAYWRIGHT_BROWSERS_PATH: "/ms-playwright"

resources:
  cpu: 2
  memory: 4096
