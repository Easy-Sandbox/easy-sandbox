# See https://pre-commit.com for more information
repos:
  # General checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: '\.vscode/'
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key

  # Secret detection (Yelp detect-secrets)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '(tests/|\.lock|\.secrets\.baseline)'

  # Linting (ruff — replaces flake8 + isort)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.9
    hooks:
      - id: ruff
        args: ['--fix']
      - id: ruff-format

  # Type annotations (optional, manual stage — does not block commits)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: ['--ignore-missing-imports', '--no-strict-optional']
        additional_dependencies:
          - pydantic
          - click
          - httpx
        pass_filenames: false
        stages: [manual]

  # Security scan
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        args: ['-c', 'pyproject.toml']
        additional_dependencies: ['bandit[toml]']
        exclude: 'tests/'

  # Custom secret-scanning (also runs via core.hooksPath)
  - repo: local
    hooks:
      - id: check-secrets
        name: check-secrets
        entry: .githooks/check-secrets.sh
        language: script
        pass_filenames: false
