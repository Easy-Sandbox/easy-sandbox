  - name: python-hello
    description: "A minimal Python hello world template for testing"
    repo: https://github.com/Serverless-Sandbox/serverless-sandbox
    path: examples/templates/python-hello
    tags: [python, hello-world, example]
    author: Serverless-Sandbox
    capabilities: [shell, files, code, ports]
    status: official

