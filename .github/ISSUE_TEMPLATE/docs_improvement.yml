name: 📖 Documentation Improvement
description: Suggest improvements to documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Documentation Page
      description: Which page needs improvement?
      placeholder: "URL or file path"
  - type: textarea
    id: description
    attributes:
      label: What needs to be improved?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Improvement
